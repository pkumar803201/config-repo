spring:
  application:
    name: api-gateway
cloud:
    gateway:
      routes:
        - id: employee-service
          uri: lb://EMPLOYEE-SERVICE
          predicates:
            - Path=/employee/**

        - id: attendance-service
          uri: lb://ATTENDANCE-SERVICE
          predicates:
            - Path=/attendance/**

        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**

        - id: ai-service
          uri: lb://AI-SERVICE
          predicates:
            - Path=/ai/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
